apiVersion: v1
kind: Service
metadata:
  name: ping
spec:
  type: NodePort
  selector:
    app: ping
  ports:
    - port: 8080        # сюда стучится pong: http://ping:8080
      targetPort: 8080  # а здесь слушает само приложение в поде
      nodePort: 30080   # а это для нас снаружи: curl $(minikube ip):30080
